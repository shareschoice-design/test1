<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Competitor Monitoring Dashboard</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --panel: #ffffff;
      --text: #1d1d1d;
      --muted: #666;
      --line: #ddd;
      --brand: #1e5f4d;
      --brand-2: #7f9f8d;
      --warn: #a25d2e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 24px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .tag {
      background: #eef3f1;
      color: var(--brand);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
    }

    .summary {
      color: var(--text);
      line-height: 1.5;
      margin: 0 0 12px;
    }

    a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    .empty {
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 24px;
      color: var(--muted);
    }

    .source-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .source-list li {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Competitor Monitoring Dashboard</h1>
    <p class="sub">Monitoring for E.ON competitor news, jobs, and regulatory updates in the Czech energy market.</p>

    <div class="tabs">
      <button class="tab active" data-tab="news">News</button>
      <button class="tab" data-tab="jobs">Jobs</button>
      <button class="tab" data-tab="regulatory">Regulatory</button>
      <button class="tab" data-tab="sources">Sources</button>
    </div>

    <section id="news" class="section active">
      <div id="newsList" class="grid"></div>
    </section>

    <section id="jobs" class="section">
      <div id="jobsList" class="grid"></div>
    </section>

    <section id="regulatory" class="section">
      <div id="regulatoryList" class="grid"></div>
    </section>

    <section id="sources" class="section">
      <ul id="sourcesList" class="source-list"></ul>
    </section>
  </div>

  <script>
    const state = {
      news: [],
      jobs: [],
      regulatory: [],
      sources: []
    };

    async function loadData() {
      const [sources, news, jobs, regulatory] = await Promise.all([
        fetch('sources.json').then(r => r.json()),
        fetch('data/news.json').then(r => r.json()),
        fetch('data/jobs.json').then(r => r.json()),
        fetch('data/regulatory.json').then(r => r.json())
      ]);

      state.sources = sources;
      state.news = news;
      state.jobs = jobs;
      state.regulatory = regulatory;

      renderCards('newsList', news, 'news');
      renderCards('jobsList', jobs, 'jobs');
      renderCards('regulatoryList', regulatory, 'regulatory');
      renderSources();
    }

    function renderCards(containerId, items, type) {
      const container = document.getElementById(containerId);

      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty">No items in this dataset yet.</div>';
        return;
      }

      const html = items.map(item => {
        const company = item.company || item.authority || 'Unknown';
        const date = item.publication_date || item.published_at || item.date || '—';
        const url = item.source_url || item.url || '#';
        const tags = (item.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
        const summary = item.summary || '';
        const location = item.location ? `<div>Location: ${item.location}</div>` : '';
        const department = item.department ? `<div>Department: ${item.department}</div>` : '';

        return `
          <article class="card">
            <div class="meta">
              <span>${company}</span>
              <span>•</span>
              <span>${date}</span>
            </div>
            <h2>${item.title}</h2>
            <div class="meta">${tags}</div>
            <p class="summary">${summary}</p>
            ${location}
            ${department}
            <p><a href="${url}" target="_blank" rel="noreferrer">Open source</a></p>
          </article>
        `;
      }).join('');

      container.innerHTML = html;
    }

    function renderSources() {
      const list = document.getElementById('sourcesList');
      list.innerHTML = state.sources.map(source => `
        <li>
          <strong>${source.company}</strong><br>
          <span>${source.type}</span><br>
          <a href="${source.url}" target="_blank" rel="noreferrer">${source.url}</a>
        </li>
      `).join('');
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    loadData().catch(err => {
      console.error('Failed to load data:', err);
      document.getElementById('newsList').innerHTML = '<div class="empty">Data failed to load.</div>';
    });
  </script>
</body>
</html>
